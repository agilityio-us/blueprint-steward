# One replica: two Stewards would share one job queue and one clone. A StatefulSet so /work (the clone, the package
# manager's store, session worktrees) survives restarts on its own volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blueprint-steward.fullname" . }}
  labels:
    {{- include "blueprint-steward.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "blueprint-steward.fullname" . }}
  selector:
    matchLabels:
      {{- include "blueprint-steward.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blueprint-steward.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000   # the image's `node` user
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: steward
          image: "{{ .Values.image.repository }}:{{ required "set image.tag to a Steward release tag" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ toJson .Values.args }}
          envFrom:
            - configMapRef:
                name: {{ include "blueprint-steward.fullname" . }}
            - secretRef:
                name: {{ .Values.secretName }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
